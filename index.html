<!DOCTYPE html>
<html>
<body>

<h2>Prueba JSONP</h2>

<input id="dni" placeholder="DNI">
<button onclick="consultar()">Consultar</button>

<div id="resultado"></div>

<script>
function consultar() {
  var dni = document.getElementById("dni").value;

  console.log("Consultando DNI:", dni);

  var script = document.createElement("script");

  script.src = "https://script.google.com/macros/s/AKfycbxSWjcCQar_kmiODloKBJmyFlA_jj3AHAeB34QcpZrDsA9kFTFFZMkhZB202aHAdqHc/exec?dni="
    + dni + "&callback=mostrar&_=" + Date.now();

  script.onload = () => console.log("Script cargado");
  script.onerror = () => console.log("Error cargando script");

  document.body.appendChild(script);
}

function mostrar(data) {
  console.log("RESPUESTA:", data);

  document.getElementById("resultado").innerText =
    JSON.stringify(data);
}
</script>

</body>
</html>
